[platformio]
default_envs = esp32_n1, esp32_n2

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -DCORE_DEBUG_LEVEL=0

[env:esp32_n1]
build_src_filter = +<n1.cpp>

[env:esp32_n2]
build_src_filter = +<n2.cpp>
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = ${env.build_flags} -DARDUINO_RUNNING_CORE=0 -DARDUINO_EVENT_RUNNING_CORE=0
